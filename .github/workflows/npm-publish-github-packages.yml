# .github/workflows/release.yml
name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*" # Запускается при создании тега вида v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build plugin
        run: npm run build
      
      - name: Verify build
        run: |
          test -f main.js || (echo "❌ main.js not found" && exit 1)
          test -f manifest.json || (echo "❌ manifest.json not found" && exit 1)
      
      - name: Create release archive
        run: |
          zip -r ai-assist.zip main.js manifest.json styles.css 2>/dev/null || \
          zip -r ai-assist.zip main.js manifest.json
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ai-assist.zip
            main.js
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
